appId: com.projecthorizon.desktop
productName: Project Horizon
copyright: Copyright © 2026 Project Horizon

directories:
  output: release
  buildResources: assets

files:
  - "dist-electron/**/*"
  - "frontend/dist/**/*"
  - "package.json"
  - "assets/**/*"

extraResources:
  - from: "release/staging/perception-service"
    to: "perception-service"
    filter:
      - "**/*"
      - "!**/__pycache__"
      - "!**/.pytest_cache"
  - from: "release/staging/native"
    to: "native"
  - from: "release/staging/app-access"
    to: "app-access"

win:
  icon: "assets/icon.ico"
  target:
    - target: dir
      arch:
        - x64
    - target: nsis
      arch:
        - x64
  artifactName: "Project-Horizon-Setup-${version}-${arch}.${ext}"


nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: "Project Horizon"


asar: true
